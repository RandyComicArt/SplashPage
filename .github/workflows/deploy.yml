name: Deploy to GitHub Pages

# Builds the site and publishes the dist/ folder:
#   - whenever main is updated
#   - every Wednesday morning, to pull in the week's new releases
#   - on demand, from the Actions tab
on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules use UTC. 15:00 UTC is 8am Pacific / 11am Eastern.
    - cron: '0 15 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A run in progress is never cancelled (the first catalog
# sync is long); a newer push waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub switches off scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling this workflow on every weekly run resets that
  # timer, so the Wednesday refresh keeps going even if nobody pushes for months.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    # The very first catalog sync makes about 1,500 slow, rate-limited requests.
    timeout-minutes: 180
    permissions:
      contents: write # lets the weekly run commit the refreshed catalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Refresh the data from Metron (weekly and manual runs only). Ordinary pushes
      # skip this and build with the data already committed to the repo, so a push
      # never wipes the site's data and never depends on Metron being reachable.
      # METRON_TOKEN is a repository secret (Settings > Secrets and variables >
      # Actions); it only exists inside these steps and never reaches the built site.
      # On the weekly run a failure stops the deploy, so the last good site stays up.
      # On a manual run a failure is tolerated and the site deploys with committed data.
      - name: Sync catalog
        if: github.event_name != 'push'
        run: npm run sync:catalog
        env:
          METRON_TOKEN: ${{ secrets.METRON_TOKEN }}
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Sync releases
        if: github.event_name != 'push'
        run: npm run sync:releases
        env:
          METRON_TOKEN: ${{ secrets.METRON_TOKEN }}
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - run: npm run check:data

      # Commit whatever was refreshed back to main, even if a later step failed, so
      # progress (like covers already looked up) is never lost.
      - name: Save refreshed data
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog/synced.json
          if [ -f public/data/releases.json ]; then git add public/data/releases.json; fi
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Weekly data sync"
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
